data:
  seed: 42
  raw_image_root: data/raw/images
  raw_labels_csv: data/raw/labels.csv
  image_root: data/processed/images
  labels_csv: data/processed/labels.csv
  splits_dir: data/splits
  processed_dir: data/processed

  columns:
    image_id: image_id
    image_path: image_path
    patient_id: patient_id
    label: label

  classes:
    - acute_otitis_media
    - cerumen_impaction
    - chronic_otitis_media
    - myringosclerosis
    - normal

  image_size: 224
  processing:
    source_image_root: data/raw/images
    source_labels_csv: data/raw/labels.csv
    output_image_root: data/processed/images
    output_labels_csv: data/processed/labels.csv
    output_report_json: data/processed/processing_report.json
    image_size: 224
    crop_to_content: false
    crop_threshold: 8
    crop_padding_ratio: 0.03
    min_content_area_ratio: 0.25
    output_format: jpg
    jpeg_quality: 95
    deduplicate_by_sha256: false

  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  augmentations:
    horizontal_flip_prob: 0.5
    rotation_degrees: 10
    color_jitter:
      brightness: 0.12
      contrast: 0.12
      saturation: 0.08
      hue: 0.02

  split:
    val_size: 0.15
    test_size: 0.15
    stratify_by_label: true
    group_column: raw_sha256
    deduplicate_by_group: true
