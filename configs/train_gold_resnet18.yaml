data_config: configs/data_gold.yaml

model:
  name: resnet18
  library: torchvision
  pretrained: true
  dropout: 0.2

train:
  run_name: gold_resnet18
  seed: 42
  device: auto
  epochs: 50
  batch_size: 32
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  class_weights: balanced
  early_stopping_patience: 8
  monitor: macro_f1

output:
  checkpoint_dir: models/checkpoints
  metrics_dir: reports/metrics

tracking:
  mlflow:
    enabled: true
    experiment_name: ear-disease-classifier
