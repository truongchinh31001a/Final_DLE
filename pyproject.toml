[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-disease-classifier"
version = "0.1.0"
description = "Otoscopy image classification pipeline for ear disease screening research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
data = [
    "kaggle>=1.6",
]
app = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "streamlit>=1.32",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
tracking = [
    "dvc>=3.0",
    "mlflow>=2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
